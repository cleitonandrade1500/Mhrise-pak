name: Compilar PAK RE Engine
on: [push]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4.2.2

      - name: Descompactar pasta do mod
        run: |
          tar -xf natives.zip

      - name: Baixar RE-PAK Tool
        run: |
          curl -L -o repak.zip https://github.com

      - name: Extrair RE-PAK Tool Garantido
        run: |
          tar -xf repak.zip

      - name: Mover Executavel para Raiz
        run: |
          Get-ChildItem -Filter RE-Pak.exe -Recurse | Move-Item -Destination . -Force

      - name: Criar o arquivo PAK do Mod
        run: |
          .\RE-Pak.exe pack natives re_chunk_000.pak.patch_001.pak

      - name: Disponibilizar para Download
        uses: actions/upload-artifact@v4
        with:
          name: mod-patch-ps4
          path: re_chunk_000.pak.patch_001.pak
